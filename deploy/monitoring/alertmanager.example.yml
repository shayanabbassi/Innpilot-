# Copy to alertmanager.yml on the host and name the real destinations (05 §4: "alert destinations verified").
# Critical alerts page the on-call owner at any hour; warnings go to the team channel in working hours.
# Fill in, then send a test alert (docs/incident-response.md, "Testing the alert path") and confirm both arrive.
global:
  smtp_smarthost: '<smtp-host>:587'
  smtp_from: 'alerts@<your-domain>'
  smtp_auth_username: '<smtp-user>'
  smtp_auth_password: '<smtp-password>'
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: on-call
      repeat_interval: 1h
receivers:
  - name: on-call
    email_configs:
      - to: '<on-call-owner>@<your-domain>'
        send_resolved: true
    # A paging or chat webhook as well, so a critical alert is seen at night:
    webhook_configs:
      - url: 'https://<paging-or-chat-webhook>'
        send_resolved: true
  - name: team
    email_configs:
      - to: '<team>@<your-domain>'
        send_resolved: true
