# Prometheus for the InnPilot stack (slice 6.6). Scrapes the API's internal metrics port; rules in alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: innpilot-api
    static_configs:
      - targets: ['api:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
