# Local production-like stack only: every alert goes to the alert-sink container, which prints it.
route:
  receiver: sink
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: sink
    webhook_configs:
      - url: 'http://alert-sink:8080/'
        send_resolved: true
